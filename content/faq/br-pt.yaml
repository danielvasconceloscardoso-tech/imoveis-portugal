# BR edition, European Portuguese: questions added to common-pt.yaml (same rules).

- id: pt-br-visa
  rank: 6
  stage: before
  cta: lawyer
  q: "Comprar casa dá direito a viver em Portugal?"
  a: >-
    Comprar e viver em Portugal são processos separados. Para viver cá precisa de um visto de residência,
    por exemplo o de quem vive de rendimentos próprios (D7) ou o visto CPLP, que depois dá acesso à
    autorização de residência da AIMA. Sobre a autorização de residência para investimento (golden visa),
    fale com um advogado: não resumimos aqui regras que não verificámos na fonte.
  facts: [pt-nonresidents-buy, pt-visa-own-income, pt-cplp-residence]

- id: pt-br-irpf
  rank: 8.5
  stage: after
  cta: tax
  q: "Tenho de declarar a casa no imposto de renda brasileiro?"
  a: >-
    Se é residente fiscal no Brasil, a casa entra em Bens e Direitos da declaração do IRPF, pelo valor de
    compra convertido em dólares e depois em reais à cotação de venda do Banco Central na data da compra.
    Com bens no estrangeiro de 1 milhão de dólares ou mais a 31 de dezembro, há ainda a declaração CBE.
  facts: [br-bens-exterior, br-cbe]
