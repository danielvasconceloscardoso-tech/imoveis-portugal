# IL edition, American English: questions added to common-en.yaml (same rules).

- id: en-il-visa
  rank: 6
  stage: before
  cta: lawyer
  q: "Does buying a home let me live in Portugal?"
  a: >-
    Buying a home and living in Portugal are separate processes: since October 7, 2023, buying a home no
    longer opens new Golden Visa applications (Law 56/2023). To live here, you apply for a residence
    visa, for example the one for people living on their own income, known as D7.
  facts: [pt-ari-realestate-ended, pt-visa-own-income]

- id: en-il-rent
  rank: 9.5
  stage: after
  cta: tax
  q: "Does Israel tax rent from my home in Portugal?"
  a: >-
    It can, but it gives you credit for the tax already paid in Portugal. Under the treaty between the
    two countries, Portugal taxes rent from homes in Portugal, at 25% for non-residents, and Israel, as
    your country of residence, allows a credit for that tax. How Israel calculates its own tax follows
    Israeli rules.
  facts: [il-pt-treaty-property, pt-rent-tax-nonresident]

- id: en-il-ifici
  rank: 10.8
  stage: after
  cta: tax
  q: "Is there a special tax regime for people moving to Portugal?"
  a: >-
    Yes, for some professions: IFICI applies a special 20% rate for 10 years to work income from
    eligible activities, such as research, higher education or highly qualified jobs. It's for people
    who become tax residents and weren't resident in any of the previous five years. It depends on your
    work, not on buying a home.
  facts: [pt-ifici-20pct]
