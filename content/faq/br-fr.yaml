# BR edition, French (Luxembourg and Paris readers): questions added to common-fr.yaml (same rules).

- id: fr-br-visa
  rank: 6
  stage: before
  cta: lawyer
  q: "Acheter un bien permet-il de vivre au Portugal ?"
  a: >-
    Acheter et s'installer au Portugal sont deux démarches distinctes. Pour y vivre, il faut un visa de
    résidence, par exemple celui des personnes vivant de leurs propres revenus (D7) ou le visa CPLP, qui
    donne ensuite accès au titre de séjour de l'AIMA. Pour le titre de séjour par investissement (golden
    visa), adressez-vous à un avocat : nous ne résumons pas des règles non vérifiées à la source.
  facts: [pt-nonresidents-buy, pt-visa-own-income, pt-cplp-residence]

- id: fr-br-irpf
  rank: 8.5
  stage: after
  cta: tax
  q: "Dois-je déclarer le bien dans l'impôt sur le revenu brésilien ?"
  a: >-
    Si vous êtes résident fiscal au Brésil, le bien se déclare dans la rubrique Bens e Direitos de l'IRPF,
    au prix d'achat converti en dollars puis en reais au cours vendeur de la Banco Central à la date
    d'achat. Avec 1 million de dollars ou plus d'avoirs à l'étranger au 31 décembre, il faut aussi la
    déclaration CBE.
  facts: [br-bens-exterior, br-cbe]
