# LU edition, European Portuguese: questions added to common-pt.yaml (same rules).

- id: pt-lu-rent
  rank: 9.5
  stage: after
  cta: tax
  q: "Tenho de declarar no Luxemburgo as rendas da casa em Portugal?"
  a: >-
    A convenção entre Portugal e o Luxemburgo dá a Portugal o direito de tributar as rendas de imóveis
    situados em Portugal, onde pagam 25%. O Luxemburgo isenta esse rendimento, mas pode tê-lo em conta para
    calcular a taxa sobre o resto do seu rendimento. O que tem de declarar lá depende do seu caso.
  facts: [lu-pt-treaty-property, pt-rent-tax-nonresident]
