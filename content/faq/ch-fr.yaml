# CH edition, French (Luxembourg and Paris readers): questions added to common-fr.yaml (same rules).

- id: fr-ch-2p
  rank: 3.5
  stage: before
  cta: tax
  q: "Puis-je utiliser mon 2e pilier pour acheter au Portugal ?"
  a: >-
    Seulement pour votre résidence principale. Les règles fédérales permettent un retrait anticipé du 2e
    pilier pour le logement que vous habitez, en Suisse ou à l'étranger, mais pas pour une résidence
    secondaire. Le retrait minimum est de 20 000 francs.
  facts: [ch-2nd-pillar-abroad]

- id: fr-ch-2p-rules
  rank: 3.6
  stage: before
  cta: tax
  q: "Quelles conditions et quels effets pour un retrait du 2e pilier ?"
  a: >-
    Un seul logement à la fois, un retrait tous les 5 ans, une demande au moins 3 ans avant la retraite et
    l'accord écrit du conjoint. Après 50 ans, le montant est plafonné. Le retrait réduit la rente future et
    doit être remboursé en cas de vente, sauf rachat d'un logement en propriété dans les 2 ans.
  facts: [ch-2p-conditions, ch-2p-effects]

- id: fr-ch-3a
  rank: 11.5
  stage: before
  cta: tax
  q: "Et le pilier 3a ?"
  a: >-
    Le pilier 3a peut aussi être retiré par anticipation pour acquérir un logement pour vos propres besoins
    ou amortir un prêt hypothécaire. Les conditions précises, comme la fréquence et l'âge, dépendent du
    contrat et des règles fédérales.
  facts: [ch-3a-home]
