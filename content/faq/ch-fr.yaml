# CH edition, French (Luxembourg and Paris readers): questions added to common-fr.yaml (same rules).

- id: fr-ch-2p
  rank: 3.5
  stage: before
  cta: tax
  q: "Puis-je utiliser mon 2e pilier pour acheter au Portugal ?"
  a: >-
    Oui, pour le logement que vous habiterez : les règles fédérales permettent un retrait anticipé du 2e
    pilier pour la résidence principale, en Suisse ou à l'étranger, mais pas pour une résidence
    secondaire ou un bien loué. Le retrait minimum est de 20 000 francs. Votre caisse de pension
    applique les règles à votre cas.
  facts: [ch-2nd-pillar-abroad]

- id: fr-ch-2p-rules
  rank: 3.6
  stage: before
  cta: tax
  q: "Quelles conditions et quels effets pour un retrait du 2e pilier ?"
  a: >-
    Il réduit votre rente future et doit être remboursé en cas de vente, sauf rachat d'un logement à habiter
    dans les 2 ans. Il vaut pour un seul bien à la fois, une fois tous les 5 ans, avec une demande au moins
    3 ans avant la retraite et l'accord écrit du conjoint. Après 50 ans, le montant est plafonné.
  facts: [ch-2p-conditions, ch-2p-effects]

- id: fr-ch-3a
  rank: 11.5
  stage: before
  cta: tax
  q: "Et le pilier 3a ?"
  a: >-
    Oui, le pilier 3a peut aussi être retiré par anticipation pour acquérir un logement pour vos propres
    besoins ou amortir un prêt hypothécaire. Les conditions précises, comme la fréquence et l'âge,
    dépendent du contrat et des règles fédérales. Votre établissement les confirme pour votre cas.
  facts: [ch-3a-home]
