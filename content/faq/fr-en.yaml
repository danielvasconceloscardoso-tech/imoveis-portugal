# FR edition, American English: questions added to common-en.yaml (same rules).

- id: en-fr-declare
  rank: 8.5
  stage: after
  cta: tax
  q: "Do I report my Portuguese home and account in France?"
  a: >-
    Bank accounts opened in Portugal are reported every year with your French tax return (form 3916), even
    if unused. Rent from the home is taxed at 25% in Portugal; the Portugal–France tax treaty sets how
    France takes it into account.
  facts: [fr-3916, pt-rent-tax-nonresident]
