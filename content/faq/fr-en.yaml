# FR edition, American English: questions added to common-en.yaml (same rules).

- id: en-fr-declare
  rank: 8.5
  stage: after
  cta: tax
  q: "Do I report my Portuguese home and account in France?"
  a: >-
    The account, yes, every year: bank accounts opened in Portugal are reported with your French tax
    return (form 3916), even if you don't use them. If you rent the home out, the rent is taxed at 25%
    in Portugal, and the Portugal–France tax treaty sets how France takes it into account.
  facts: [fr-3916, pt-rent-tax-nonresident]
