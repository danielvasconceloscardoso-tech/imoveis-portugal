# US edition, American English: questions added to common-en.yaml (same rules).

- id: en-us-visa
  rank: 6
  stage: before
  cta: lawyer
  q: "Does buying a home let me live in Portugal?"
  a: >-
    Buying a home and living in Portugal are separate processes: since October 7, 2023, buying a home no
    longer opens new Golden Visa applications (Law 56/2023). To live here, you apply for a residence
    visa, for example the one for people living on their own income, known as D7.
  facts: [pt-ari-realestate-ended, pt-visa-own-income]

- id: en-us-report
  rank: 8.5
  stage: after
  cta: tax
  q: "Do I have to report my Portuguese bank account to the US?"
  a: >-
    Yes, if your foreign accounts add up to more than $10,000 at any point in the year: US persons then file
    an FBAR with FinCEN. If you live abroad, you may also need Form 8938 once foreign assets top $200,000 at
    year end or $300,000 at any time (single filers; $400,000 and $600,000 for joint filers).
  facts: [us-fbar, us-8938-abroad]

- id: en-us-sale
  rank: 10.5
  stage: after
  cta: tax
  q: "Is the gain on selling my Portuguese home taxed in the US?"
  a: >-
    It can be taxed in both countries, but you don't pay twice on the same gain. Under the Portugal–US
    tax treaty, Portugal may tax gains on homes in Portugal, and the US keeps the right to tax its
    citizens. The foreign tax credit (Form 1116) lets you offset the Portuguese tax against US tax.
  facts: [us-pt-treaty-gains]

- id: en-us-ifici
  rank: 10.8
  stage: after
  cta: tax
  q: "Is there a special tax regime for people moving to Portugal?"
  a: >-
    Yes, for some professions: IFICI applies a special 20% rate for 10 years to work income from
    eligible activities, such as research, higher education or highly qualified jobs. It's for people
    who become tax residents and weren't resident in any of the previous five years. It depends on your
    work, not on buying a home.
  facts: [pt-ifici-20pct]
