# US edition, American English: questions added to common-en.yaml (same rules).

- id: en-us-visa
  rank: 6
  stage: before
  cta: lawyer
  q: "Does buying a home let me live in Portugal?"
  a: >-
    Buying and living in Portugal are separate processes. To live here you need a residence visa, for
    example the one for people living on their own income (D7). For the residence permit for investment
    (Golden Visa), talk to a lawyer: we don't summarize rules we haven't checked at the source.
  facts: [pt-nonresidents-buy, pt-visa-own-income]

- id: en-us-report
  rank: 8.5
  stage: after
  cta: tax
  q: "Do I have to report my Portuguese bank account to the US?"
  a: >-
    If your foreign accounts add up to more than $10,000 at any time during the year, US persons file an
    FBAR with FinCEN. If you live abroad, you may also need Form 8938 once foreign assets exceed $200,000 at
    year end or $300,000 at any time (single filers; $400,000 and $600,000 for joint filers).
  facts: [us-fbar, us-8938-abroad]

- id: en-us-sale
  rank: 10.5
  stage: after
  cta: tax
  q: "Is the gain on selling my Portuguese home taxed in the US?"
  a: >-
    Under the Portugal–US tax treaty, Portugal may tax gains on property located in Portugal, and the US
    keeps the right to tax its citizens. The foreign tax credit (Form 1116) lets you offset Portuguese tax
    against US tax on the same income.
  facts: [us-pt-treaty-gains]
