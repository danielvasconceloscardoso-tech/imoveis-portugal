# Common FAQ, Brazilian Portuguese (pt-BR). Used by the BR edition.
# Same rules and fact ids as common-pt.yaml.

- id: br-01
  q: Posso comprar imóvel em Portugal sem morar lá?
  a: >-
    Sim. Quem mora fora compra imóvel em Portugal, e a lei do IMT tem até uma alíquota própria para não
    residentes. Antes de assinar, você precisa de um número de contribuinte (NIF). Quem mora fora da União
    Europeia tem de nomear um representante fiscal, a não ser que adira às notificações eletrônicas das Finanças.
  cta: talk-lawyer
  facts: [pt-nonresidents-buy, pt-nif-nonresident, pt-tax-rep]

- id: br-02
  q: Quanto custa além do preço do imóvel?
  a: >-
    IMT, imposto do selo de 0,8% sobre o preço, escritura e registro. Desde maio de 2026, quem não é residente
    fiscal em Portugal paga IMT à alíquota única de 7,5%, salvo exceções, como se tornar residente nos dois
    anos seguintes. Com financiamento, somam-se imposto do selo de 0,6% sobre o empréstimo e de 4% sobre os juros.
  cta: guide
  facts: [pt-is-purchase, pt-imt-nonresident-flat, pt-imt-nonresident-exceptions, pt-is-loan-5y, pt-is-interest]

- id: br-03
  q: Consigo financiamento morando fora de Portugal?
  a: >-
    Cada banco decide e avalia a renda de quem pede. Para todos valem os limites do Banco de Portugal: o
    empréstimo pode chegar a 90% do valor para moradia própria e permanente e a 80% para outras finalidades,
    como uma casa de férias. O valor de referência é o menor entre o preço e a avaliação.
  cta: talk-bank
  facts: [pt-ltv-limits]

- id: br-04
  q: Preciso estar em Portugal para assinar?
  a: >-
    Não. Você pode dar uma procuração, por exemplo a um advogado, assinada em um consulado de Portugal ou
    em um cartório no Brasil. No cartório, a procuração precisa da Apostila de Haia para valer em Portugal.
  cta: talk-lawyer
  facts: [pt-poa-apostille]

- id: br-05
  q: O que é o CPCV?
  a: >-
    É o contrato-promessa de compra e venda, assinado antes da escritura. Ele fixa o preço, a data e o sinal.
    Se o comprador desistir por culpa dele, perde o sinal; se for o vendedor, o comprador pode exigir o dobro
    do que pagou (Código Civil português, artigo 442). Um advogado parceiro pode revisar antes da assinatura.
  cta: talk-lawyer
  facts: [pt-sinal-442]

- id: br-06
  q: Que impostos pago todo ano?
  a: >-
    O IMI, um imposto municipal entre 0,3% e 0,45% do valor patrimonial tributário do imóvel, com a alíquota
    fixada por cada município. O AIMI só incide sobre a soma dos valores patrimoniais acima de 600 000 € por pessoa.
  cta: talk-tax
  facts: [pt-imi-rates, pt-aimi-deduction]

- id: br-07
  q: Posso alugar o imóvel?
  a: >-
    Sim, com aluguel de longa duração ou como alojamento local (curta duração). O alojamento local exige
    registro prévio, e o município pode se opor em 60 dias, ou em 90 nas áreas de contenção que ele define.
    Aluguéis residenciais de não residentes são tributados em Portugal a 25%, com reduções para contratos longos.
  cta: talk-tax
  facts: [pt-al-registration, pt-rent-tax-nonresident]

- id: br-08
  q: Como envio o dinheiro?
  a: >-
    Pelo seu banco ou por um serviço de câmbio e remessas, e as condições variam de um para outro. Bancos,
    notários e advogados em Portugal têm de obter informação sobre a origem dos recursos quando a operação
    justifica (Lei 83/2017), por isso podem pedir comprovantes.
  cta: talk-fx
  facts: [pt-aml-funds]

- id: br-09
  q: Herdei um imóvel em Portugal. E agora?
  a: >-
    Os herdeiros decidem juntos se ficam com o imóvel, vendem ou alugam. Cônjuge ou companheiro, filhos e pais
    estão isentos do imposto do selo de 10% sobre a herança em Portugal; os outros herdeiros pagam. Os registros
    e demais formalidades continuam valendo para todos.
  cta: talk-lawyer
  facts: [pt-is-inheritance-exempt]

- id: br-10
  q: É um bom momento para comprar?
  a: >-
    Não damos conselhos de investimento. Os fatos: segundo o INE, os preços dos imóveis em Portugal subiram
    17,6% em 2025, a maior alta da série. O que importa é seu orçamento, a região e seus planos. Conte o que
    você procura e a imobiliária parceira mostra o que existe.
  cta: agency
  facts: [pt-ine-prices-2025]

- id: br-11
  q: Vocês podem encontrar um imóvel para mim?
  a: >-
    Sim. Diga a região, o orçamento e o prazo. A imobiliária licenciada parceira entra em contato, sem custo
    para você, e pode organizar visitas para quando você estiver em Portugal.
  cta: agency
  facts: []

- id: br-12
  q: Isto é assessoria financeira, jurídica ou tributária?
  a: >-
    Não. Reunimos informações de fontes oficiais para você entender as regras. Para o seu caso, fale com um
    profissional: podemos colocar você em contato com nossos parceiros.
  cta: talk-lawyer
  facts: []
