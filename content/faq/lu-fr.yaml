# LU edition, French (Luxembourg and Paris readers): questions added to common-fr.yaml (same rules).

- id: fr-lu-rent
  rank: 9.5
  stage: after
  cta: tax
  q: "Dois-je déclarer au Luxembourg les loyers de mon bien au Portugal ?"
  a: >-
    La convention entre le Portugal et le Luxembourg donne au Portugal le droit d'imposer les loyers des
    biens situés sur son territoire, à 25 %. Le Luxembourg exonère ces revenus, mais peut en tenir compte
    pour fixer le taux sur vos autres revenus. Vos obligations déclaratives au Luxembourg dépendent de votre
    situation.
  facts: [lu-pt-treaty-property, pt-rent-tax-nonresident]
