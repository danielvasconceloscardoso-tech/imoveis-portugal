# LU edition, French (Luxembourg and Paris readers): questions added to common-fr.yaml (same rules).

- id: fr-lu-rent
  rank: 9.5
  stage: after
  cta: tax
  q: "Dois-je déclarer au Luxembourg les loyers de mon bien au Portugal ?"
  a: >-
    Les loyers sont imposés au Portugal, à 25 % pour les non-résidents, et le Luxembourg ne les impose
    pas une seconde fois, selon la convention entre les deux pays. Le Luxembourg exonère ce revenu mais
    peut en tenir compte pour le taux appliqué au reste. Vos déclarations là-bas dépendent de votre
    situation.
  facts: [lu-pt-treaty-property, pt-rent-tax-nonresident]
