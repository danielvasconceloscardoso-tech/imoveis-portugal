# Luxembourg edition, French: questions added to common-fr.yaml.

- id: lu-fr-01
  q: Dois-je déclarer au Luxembourg les loyers de mon bien au Portugal ?
  a: >-
    La convention entre le Portugal et le Luxembourg donne au Portugal le droit d'imposer les loyers d'un bien
    situé au Portugal. Le Luxembourg exonère ce revenu mais peut en tenir compte pour fixer le taux d'impôt sur
    le reste de vos revenus. Vos obligations de déclaration au Luxembourg dépendent de votre situation.
  cta: talk-tax
  facts: [lu-pt-treaty-property]
