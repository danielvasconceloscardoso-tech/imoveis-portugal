# Luxembourg edition (pt-PT): questions added to common-pt.yaml.
# Left out until verified (see content/faq/UNVERIFIED.md): "Um banco luxemburguês pode financiar uma casa em Portugal?"

- id: lu-01
  q: Tenho de declarar no Luxemburgo as rendas da casa em Portugal?
  a: >-
    A convenção entre Portugal e o Luxemburgo dá a Portugal o direito de tributar as rendas de imóveis
    situados em Portugal. O Luxemburgo isenta esse rendimento, mas pode tê-lo em conta para calcular a taxa
    de imposto sobre o resto do seu rendimento. As obrigações de declaração no Luxemburgo dependem do seu caso.
  cta: talk-tax
  facts: [lu-pt-treaty-property]
