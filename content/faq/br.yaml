# Brazil edition (pt-BR): questions added to common-br.yaml.

- id: brx-01
  q: Preciso de visto para comprar imóvel em Portugal?
  a: >-
    Para comprar, não: não residentes compram imóveis em Portugal, e a lei do IMT tem até uma alíquota
    própria para eles. Para morar, sim: é preciso um visto de residência, como o de quem vive de rendimentos
    próprios (o D7) ou o visto CPLP, que depois dá acesso à autorização de residência emitida pela AIMA.
  cta: talk-lawyer
  facts: [pt-nonresidents-buy, pt-visa-own-income, pt-cplp-residence]

- id: brx-02
  q: Tenho de declarar o imóvel no imposto de renda?
  a: >-
    Se você é residente fiscal no Brasil e declara IRPF, o imóvel no exterior entra em Bens e Direitos, pelo
    valor de aquisição convertido em dólares e depois em reais pela cotação de venda do Banco Central na data
    da compra. Se seus bens no exterior somarem US$ 1 milhão ou mais em 31 de dezembro, há também a declaração CBE.
  cta: talk-tax
  facts: [br-bens-exterior, br-cbe]
