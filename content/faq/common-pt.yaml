# FAQ shared by every edition, European Portuguese (prompts 09 and 10). Written natively, not translated.
# Questions ranked by search interest (rank), grouped by stage (before, buying, after); see content/FAQ_SOURCES.md
# and design/v2/BENCHMARK.md. Answers: 40-70 words, the answer in the first sentence, then the detail, then the
# partner action (`cta`: lawyer, bank, tax, fx, developer, agency). Facts only from content/facts/facts.csv.
# Voice: content/VOICE.md. Terms: content/GLOSSARY.md.

- id: pt-buy-abroad
  rank: 1
  stage: before
  cta: lawyer
  q: "Posso comprar casa em Portugal se viver no estrangeiro?"
  a: >-
    Pode comprar casa em Portugal sem viver cá nem ser residente; o Código do IMT tem até uma taxa
    própria para não residentes. Antes de assinar, precisa do NIF, o número de contribuinte português.
    Quem vive fora da UE nomeia também um representante fiscal ou adere às notificações eletrónicas das
    Finanças.
  facts: [pt-nonresidents-buy, pt-nif-nonresident, pt-tax-rep]

- id: pt-costs
  rank: 2
  stage: before
  cta: tax
  q: "Quanto custa comprar casa, além do preço?"
  a: >-
    Somam-se o IMT, o imposto do selo de 0,8% e a escritura com registo, que custa 375 € ou 700 € no
    balcão Casa Pronta. Para quem não é residente fiscal, o IMT é de 7,5% do preço, salvo exceções. Com
    crédito, acresce imposto do selo de 0,6% sobre o empréstimo e de 4% sobre os juros.
  facts: [pt-is-purchase, pt-imt-nonresident-flat, pt-imt-nonresident-exceptions, pt-is-loan-5y, pt-is-interest, pt-casa-pronta-fees]

- id: pt-mortgage
  rank: 3
  stage: before
  cta: bank
  q: "Consigo crédito à habitação sem viver em Portugal?"
  a: >-
    Pode pedir crédito a um banco português, que decide caso a caso. Os limites do Banco de Portugal
    valem para todos: até 90% do valor para a morada principal e até 80% para outra casa, como uma casa
    de férias. O banco conta com o valor mais baixo entre o preço e a avaliação.
  facts: [pt-ltv-limits]

- id: pt-nif
  rank: 4
  stage: before
  cta: lawyer
  q: "Como peço o NIF?"
  a: >-
    O NIF, o número de contribuinte português, pede-se online através de um representante legal ou ao
    balcão das Finanças, sem precisar de representante fiscal. É o primeiro passo de qualquer compra.
    Depois de comprar, quem vive fora da UE tem 15 dias para nomear um representante fiscal ou aderir às
    notificações eletrónicas.
  facts: [pt-nif-nonresident, pt-tax-rep]

- id: pt-imt-nonres
  rank: 5
  stage: buying
  cta: tax
  q: "Os não residentes pagam mais IMT?"
  a: >-
    Desde maio de 2026, os não residentes fiscais pagam IMT à taxa única de 7,5%, sem isenções. Há
    exceções para quem já foi considerado residente fiscal, quem passa a residente nos dois anos
    seguintes e quem arrenda a casa para habitação dentro dos limites de renda da lei; nos dois últimos
    casos, a diferença é devolvida a pedido.
  facts: [pt-imt-nonresident-flat, pt-imt-nonresident-exceptions]

- id: pt-hpp
  rank: 6
  stage: buying
  cta: tax
  q: "O que é habitação própria permanente e quem tem direito?"
  a: >-
    É a casa comprada para ser, exclusivamente, a sua residência própria e permanente, provada no IRS
    pelo domicílio fiscal. Dá acesso à tabela de IMT mais baixa (0% até 106 346 €) e a crédito até 90%
    do valor, contra 80% nas outras casas. Os não residentes fiscais pagam 7,5% de IMT e, se passarem a
    residentes em dois anos, pedem a diferença.
  facts: [pt-imt-hpp-2026, pt-hpp-tax-domicile, pt-imt-nonresident-flat, pt-imt-nonresident-exceptions, pt-ltv-limits]

- id: pt-deed
  rank: 5.5
  stage: buying
  cta: lawyer
  q: "Quanto custam a escritura e o registo?"
  a: >-
    No balcão Casa Pronta, escritura e registo fazem-se de uma só vez: 375 €, ou 700 € com crédito e
    hipoteca, mais 50 € por cada imóvel adicional. Leva-se a licença de utilização, ou a sua dispensa
    conforme a data de construção, e o certificado energético. Os honorários de advogado são à parte.
  facts: [pt-casa-pronta-fees, pt-casa-pronta-docs]

- id: pt-lawyer
  rank: 7
  stage: buying
  cta: lawyer
  q: "Preciso de advogado para comprar casa?"
  a: >-
    A escolha é sua, e à distância um advogado poupa-lhe viagens. Pode verificar o registo do imóvel e
    documentos como a licença de utilização, rever o contrato-promessa antes da assinatura e
    representá-lo na escritura por procuração. Um advogado parceiro pode acompanhar a compra do início
    ao fim.
  facts: [pt-poa-apostille, pt-sinal-442, pt-casa-pronta-docs]

- id: pt-yearly
  rank: 8
  stage: after
  cta: tax
  q: "Que impostos pago todos os anos?"
  a: >-
    Paga-se o IMI, um imposto municipal entre 0,3% e 0,45% do valor patrimonial tributário, o valor
    fiscal da casa. Cada câmara municipal fixa a sua taxa, que por isso varia de concelho para concelho.
    O AIMI, um adicional, só se aplica quando a soma dos valores patrimoniais passa de 600 000 € por
    pessoa.
  facts: [pt-imi-rates, pt-aimi-deduction]

- id: pt-rent
  rank: 9
  stage: after
  cta: tax
  q: "Posso arrendar a casa?"
  a: >-
    Pode arrendar a longo prazo ou em alojamento local, o arrendamento a turistas, com registo prévio: a
    câmara pode opor-se em 60 dias, ou em 90 nas zonas de contenção. Para não residentes, as rendas de
    habitação pagam 25% em Portugal, com reduções nos contratos longos. O país onde vive pode ter regras
    próprias.
  facts: [pt-al-registration, pt-rent-tax-nonresident]

- id: pt-sell
  rank: 10
  stage: after
  cta: tax
  q: "Quanto pago de imposto ao vender a casa?"
  a: >-
    Em Portugal, só metade da mais-valia conta para o IRS: o ganho na venda de um imóvel entra em 50% do
    seu valor, e a taxa final depende dos seus rendimentos. O país onde vive pode ter regras próprias
    para essa venda, e as contas fazem-se dos dois lados.
  facts: [pt-cg-50pct]

- id: pt-borrow
  rank: 11
  stage: before
  cta: bank
  q: "Quanto me empresta o banco?"
  a: >-
    Depende sobretudo do seu rendimento. Pelas regras do Banco de Portugal, as prestações de todos os
    seus créditos, somadas, não devem passar de 45% do rendimento líquido. O prazo vai até 40 anos se
    tiver até 35 anos de idade, e até 35 anos a partir daí.
  facts: [pt-dsti-45, pt-maturity-limits]

- id: pt-sign
  rank: 12
  stage: buying
  cta: lawyer
  q: "Tenho de estar em Portugal para assinar?"
  a: >-
    Pode assinar a partir do país onde vive, com uma procuração: um advogado, por exemplo, assina por
    si. A procuração faz-se num consulado português ou num notário do país onde vive. Se for feita num
    notário estrangeiro, leva a Apostila de Haia, o selo que a torna válida em Portugal.
  facts: [pt-poa-apostille]

- id: pt-cpcv
  rank: 13
  stage: buying
  cta: lawyer
  q: "O que é o contrato-promessa (CPCV)?"
  a: >-
    É o contrato assinado antes da escritura, que fixa o preço, a data e o sinal, o valor pago nesse
    dia. Protege as duas partes: se o comprador desistir por culpa sua, perde o sinal; se a culpa for do
    vendedor, o comprador pode exigir o dobro do que pagou (Código Civil, artigo 442.º).
  facts: [pt-sinal-442]

- id: pt-money
  rank: 14
  stage: buying
  cta: fx
  q: "Como transfiro o dinheiro para Portugal?"
  a: >-
    Pelo seu banco ou por um serviço de transferências. O câmbio e as comissões variam muito entre eles
    e pesam em valores altos. Bancos, notários e advogados têm de pedir comprovativos da origem do
    dinheiro quando a operação o justifica (Lei 83/2017), por isso convém tê-los à mão.
  facts: [pt-aml-funds]

- id: pt-imt-calc
  rank: 15
  stage: buying
  cta: tax
  q: "Como se calcula o IMT e quando se paga?"
  a: >-
    Para residentes, depende do uso da casa e do preço, por escalões: na morada principal, 0% até 106
    346 €; numa casa de férias, 1% nesse escalão; a taxa sobe a partir daí. Quem não é residente fiscal
    paga a taxa única de 7,5%. O IMT paga-se no dia da liquidação ou nos 30 dias seguintes.
  facts: [pt-imt-hpp-2026, pt-imt-second-home-2026, pt-imt-payment]

- id: pt-timing
  rank: 16
  stage: before
  cta: agency
  q: "É boa altura para comprar?"
  a: >-
    Não fazemos previsões nem damos conselhos de investimento, mas mostramos os factos: segundo o INE, os
    preços da habitação em Portugal subiram 17,6% em 2025, a maior subida da série. O resto depende do seu
    orçamento, da região e do que procura numa casa. Um consultor qualificado mostra-lhe o que existe hoje,
    sem compromisso.
  # Prompt 66 §3: the wording that names the partner agency, used when config.agency.public is true.
  a_named: >-
    Não fazemos previsões nem damos conselhos de investimento, mas mostramos os factos: segundo o INE,
    os preços da habitação em Portugal subiram 17,6% em 2025, a maior subida da série. O resto depende
    do seu orçamento, da região e do que procura numa casa. A nossa agência parceira mostra-lhe o que
    existe hoje, sem compromisso.
  facts: [pt-ine-prices-2025]

- id: pt-find
  rank: 17
  stage: before
  cta: agency
  q: "Podem encontrar-me uma casa?"
  a: >-
    Diga-nos a região, o orçamento e o prazo: o pedido segue para um consultor qualificado de uma mediadora
    imobiliária licenciada, que o contacta sem custos para si. Pode ver as casas por videochamada, através
    de alguém da sua confiança ou ao vivo quando vier a Portugal, e comprar sem estar cá, por procuração.
  # Prompt 66 §3: the wording that names the partner agency, used when config.agency.public is true.
  a_named: >-
    Diga-nos a região, o orçamento e o prazo: o pedido segue para a nossa agência parceira licenciada, a
    Habinedita Gondomar, que o contacta sem custos para si. Pode ver as casas por videochamada, através
    de alguém da sua confiança ou ao vivo quando vier a Portugal, e comprar sem estar cá, por
    procuração.
  facts: []

- id: pt-inherit
  rank: 18
  stage: after
  cta: lawyer
  q: "Herdei uma casa em Portugal: o que tenho de fazer?"
  a: >-
    Os herdeiros decidem em conjunto se ficam com a casa, a vendem ou a arrendam. Cônjuge ou unido de
    facto, filhos e pais estão isentos do imposto do selo de 10% sobre a herança; os outros herdeiros
    pagam-no. Os registos e as restantes formalidades são obrigatórios para todos e podem tratar-se à
    distância.
  facts: [pt-is-inheritance-exempt]
