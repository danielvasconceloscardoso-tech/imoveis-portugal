# LU edition, American English: questions added to common-en.yaml (same rules).

- id: en-lu-rent
  rank: 9.5
  stage: after
  cta: tax
  q: "Do I report rent from my Portuguese home in Luxembourg?"
  a: >-
    The rent is taxed in Portugal, and Luxembourg doesn't tax it again. Under the treaty between the two
    countries, Portugal taxes rent from homes in Portugal, at 25% for non-residents. Luxembourg exempts that
    income but may use it to set the rate on the rest of your income. What you report there depends on your
    situation.
  facts: [lu-pt-treaty-property, pt-rent-tax-nonresident]
