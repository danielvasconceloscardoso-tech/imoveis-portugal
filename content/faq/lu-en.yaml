# LU edition, American English: questions added to common-en.yaml (same rules).

- id: en-lu-rent
  rank: 9.5
  stage: after
  cta: tax
  q: "Do I report rent from my Portuguese home in Luxembourg?"
  a: >-
    The Portugal–Luxembourg tax treaty gives Portugal the right to tax rent from property located there, at
    25%. Luxembourg exempts that income but may use it to set the rate on the rest of your income. What you
    must report in Luxembourg depends on your situation.
  facts: [lu-pt-treaty-property, pt-rent-tax-nonresident]
