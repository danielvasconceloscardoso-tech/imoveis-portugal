# BR edition, American English: questions added to common-en.yaml (same rules).

- id: en-br-visa
  rank: 6
  stage: before
  cta: lawyer
  q: "Does buying a home let me live in Portugal?"
  a: >-
    Buying and living in Portugal are separate processes. To live here you need a residence visa, for
    example the one for people living on their own income (D7) or the CPLP visa, which then leads to a
    residence permit from AIMA. For the residence permit for investment (Golden Visa), talk to a lawyer: we
    don't summarize rules we haven't checked at the source.
  facts: [pt-nonresidents-buy, pt-visa-own-income, pt-cplp-residence]

- id: en-br-irpf
  rank: 8.5
  stage: after
  cta: tax
  q: "Do I report the home on my Brazilian income tax return?"
  a: >-
    If you're a Brazilian tax resident, the home goes under Bens e Direitos on the IRPF return, at the
    purchase price converted to dollars and then to reais at the Banco Central selling rate on the purchase
    date. With assets abroad of US$1 million or more on December 31, you also file the CBE declaration.
  facts: [br-bens-exterior, br-cbe]
