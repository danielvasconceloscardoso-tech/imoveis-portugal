# Brazil edition, English: questions added to common-en.yaml.

- id: br-en-01
  q: Do I need a visa to buy a home in Portugal?
  a: >-
    Not to buy: non-residents buy homes in Portugal, and the transfer tax code even has a rate for them. To live
    there, yes: you need a residence visa, such as the one for people living on their own income (D7) or the
    CPLP visa, which then gives access to a residence permit issued by AIMA.
  cta: talk-lawyer
  facts: [pt-nonresidents-buy, pt-visa-own-income, pt-cplp-residence]

- id: br-en-02
  q: Do I have to declare the home in my Brazilian tax return?
  a: >-
    If you are a Brazilian tax resident who files an IRPF return, the home goes under Bens e Direitos, at its
    purchase value converted into dollars and then reais at the Banco Central selling rate on the purchase date.
    With assets abroad of US$1 million or more on 31 December, the CBE declaration also applies.
  cta: talk-tax
  facts: [br-bens-exterior, br-cbe]
