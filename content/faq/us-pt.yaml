# US edition, European Portuguese: questions added to common-pt.yaml (same rules).

- id: pt-us-visa
  rank: 6
  stage: before
  cta: lawyer
  q: "Comprar casa dá direito a viver em Portugal?"
  a: >-
    Não. Desde 7 de outubro de 2023, comprar casa deixou de dar acesso a novos vistos gold (Lei 56/2023).
    Comprar e viver em Portugal são processos separados: para viver cá precisa de um visto de residência,
    por exemplo o de quem vive de rendimentos próprios (D7). Um advogado parceiro pode ver qual se aplica a
    si.
  facts: [pt-ari-realestate-ended, pt-visa-own-income]

- id: pt-us-report
  rank: 8.5
  stage: after
  cta: tax
  q: "Tenho de declarar a conta portuguesa nos Estados Unidos?"
  a: >-
    Sim, se as suas contas no estrangeiro somarem mais de 10 000 USD em algum momento do ano: os US persons
    entregam então o FBAR à FinCEN. Se viver fora dos EUA, pode ter ainda de entregar o formulário 8938, com
    ativos no estrangeiro acima de 200 000 USD no fim do ano ou 300 000 USD em qualquer momento
    (individual).
  facts: [us-fbar, us-8938-abroad]

- id: pt-us-sale
  rank: 10.5
  stage: after
  cta: tax
  q: "A venda da casa em Portugal é tributada nos Estados Unidos?"
  a: >-
    Pode ser tributada nos dois países, mas sem pagar duas vezes pelo mesmo. Pela convenção entre Portugal e
    os EUA, Portugal pode tributar a mais-valia de casas em Portugal, e os EUA mantêm o direito de tributar
    os seus cidadãos. O crédito por imposto estrangeiro (formulário 1116) desconta o imposto português no
    americano. Um consultor fiscal parceiro faz as contas.
  facts: [us-pt-treaty-gains]

- id: pt-us-ifici
  rank: 10.8
  stage: after
  cta: tax
  q: "Há um regime fiscal especial para quem se muda para Portugal?"
  a: >-
    Sim, para algumas profissões. O IFICI aplica uma taxa especial de 20% durante 10 anos ao rendimento do
    trabalho em atividades elegíveis, como investigação, ensino superior ou empregos altamente qualificados.
    É para quem passa a residente fiscal e não foi residente em nenhum dos cinco anos anteriores. Comprar
    casa, por si, não dá acesso. Um consultor fiscal parceiro vê se se aplica.
  facts: [pt-ifici-20pct]
