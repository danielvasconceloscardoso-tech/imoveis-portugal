# US edition, European Portuguese: questions added to common-pt.yaml (same rules).

- id: pt-us-visa
  rank: 6
  stage: before
  cta: lawyer
  q: "Comprar casa dá direito a viver em Portugal?"
  a: >-
    Comprar e viver em Portugal são processos separados. Para viver cá precisa de um visto de residência,
    por exemplo o de quem vive de rendimentos próprios (D7). Sobre a autorização de residência para
    investimento (golden visa), fale com um advogado: não resumimos aqui regras que não verificámos na
    fonte.
  facts: [pt-nonresidents-buy, pt-visa-own-income]

- id: pt-us-report
  rank: 8.5
  stage: after
  cta: tax
  q: "Tenho de declarar a conta portuguesa nos Estados Unidos?"
  a: >-
    Se o total das suas contas no estrangeiro passar de 10 000 USD em algum momento do ano, os US persons
    entregam o FBAR à FinCEN. Quem vive fora dos Estados Unidos pode ainda ter de entregar o formulário
    8938, acima de 200 000 USD no fim do ano ou 300 000 USD a qualquer momento (individual).
  facts: [us-fbar, us-8938-abroad]

- id: pt-us-sale
  rank: 10.5
  stage: after
  cta: tax
  q: "A venda da casa em Portugal é tributada nos Estados Unidos?"
  a: >-
    Pela convenção entre Portugal e os Estados Unidos, Portugal pode tributar as mais-valias de imóveis
    situados em Portugal, e os Estados Unidos mantêm o direito de tributar os seus cidadãos. O crédito por
    imposto estrangeiro (formulário 1116) permite abater o imposto português ao americano.
  facts: [us-pt-treaty-gains]
