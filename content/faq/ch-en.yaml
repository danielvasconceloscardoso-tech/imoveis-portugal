# CH edition, American English: questions added to common-en.yaml (same rules).

- id: en-ch-2p
  rank: 3.5
  stage: before
  cta: tax
  q: "Can I use my 2nd pillar to buy a home in Portugal?"
  a: >-
    Only for your main residence. Federal rules allow an early 2nd-pillar withdrawal for the home you live
    in, in Switzerland or abroad, but not for a vacation home. The minimum withdrawal is 20,000 francs.
  facts: [ch-2nd-pillar-abroad]

- id: en-ch-2p-rules
  rank: 3.6
  stage: before
  cta: tax
  q: "What are the conditions and effects of a 2nd-pillar withdrawal?"
  a: >-
    One property at a time, one withdrawal every 5 years, a request at least 3 years before retirement and
    your spouse's written consent. After 50 the amount is capped. The withdrawal reduces your future pension
    and must be repaid if you sell, unless you buy another home to live in within 2 years.
  facts: [ch-2p-conditions, ch-2p-effects]

- id: en-ch-3a
  rank: 11.5
  stage: before
  cta: tax
  q: "What about pillar 3a?"
  a: >-
    Pillar 3a can also be withdrawn early to buy a home for your own use or to pay down a mortgage. The
    specific conditions, such as timing and age, depend on your contract and federal rules.
  facts: [ch-3a-home]
