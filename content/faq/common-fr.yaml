# FAQ shared by every edition, French (Luxembourg and Paris readers) (prompts 09 and 10). Written natively, not translated.
# Questions ranked by search interest (rank), grouped by stage (before, buying, after); see content/FAQ_SOURCES.md
# and design/v2/BENCHMARK.md. Answers: 40-70 words, the answer in the first sentence, then the detail, then the
# partner action (`cta`: lawyer, bank, tax, fx, developer, agency). Facts only from content/facts/facts.csv.
# Voice: content/VOICE.md. Terms: content/GLOSSARY.md.

- id: fr-buy-abroad
  rank: 1
  stage: before
  cta: lawyer
  q: "Puis-je acheter au Portugal si je vis à l'étranger ?"
  a: >-
    Oui, vous pouvez acheter au Portugal sans y vivre ni y être résident, et la loi sur l'IMT prévoit
    même un taux propre aux acheteurs de l'étranger. Avant de signer, vous demandez un NIF, votre numéro
    fiscal portugais. Hors de l'UE, vous désignez aussi un représentant fiscal ou adhérez aux
    notifications électroniques des Finances.
  facts: [pt-nonresidents-buy, pt-nif-nonresident, pt-tax-rep]

- id: fr-costs
  rank: 2
  stage: before
  cta: tax
  q: "Quels sont les frais d'achat, au-delà du prix ?"
  a: >-
    Prévoyez l'IMT, un droit de timbre de 0,8 % et l'acte avec l'enregistrement, qui coûte 375 € ou 700
    € au guichet Casa Pronta. Si vous n'êtes pas résident fiscal au Portugal, l'IMT est de 7,5 % du
    prix, sauf exceptions. Avec un crédit s'ajoutent 0,6 % de droit de timbre sur le prêt et 4 % sur les
    intérêts.
  facts: [pt-is-purchase, pt-imt-nonresident-flat, pt-imt-nonresident-exceptions, pt-is-loan-5y, pt-is-interest, pt-casa-pronta-fees]

- id: fr-mortgage
  rank: 3
  stage: before
  cta: bank
  q: "Puis-je obtenir un crédit au Portugal sans y habiter ?"
  a: >-
    Oui, vous pouvez le demander à une banque portugaise, qui décide au cas par cas. Les règles de la
    Banque du Portugal valent pour tous : jusqu'à 90 % de la valeur pour la résidence principale et
    jusqu'à 80 % pour un autre logement, comme une résidence secondaire. La banque retient le plus bas
    du prix et de son expertise.
  facts: [pt-ltv-limits]

- id: fr-nif
  rank: 4
  stage: before
  cta: lawyer
  q: "Comment obtenir un NIF ?"
  a: >-
    Le NIF est votre numéro fiscal portugais et la première étape de tout achat : vous le demandez en
    ligne par un représentant légal, ou sur place aux Finances. Aucun représentant fiscal n'est
    nécessaire pour l'obtenir. Après l'achat, hors de l'UE, vous avez 15 jours pour désigner un
    représentant fiscal ou adhérer aux notifications électroniques.
  facts: [pt-nif-nonresident, pt-tax-rep]

- id: fr-imt-nonres
  rank: 5
  stage: buying
  cta: tax
  q: "Les non-résidents paient-ils plus d'IMT ?"
  a: >-
    Oui : depuis mai 2026, un acheteur non-résident fiscal au Portugal paie l'IMT au taux unique de 7,5 %,
    sans exonération. Exceptions : avoir déjà été considéré comme résident fiscal, le devenir dans les deux
    ans, ou louer le logement comme résidence principale avec un loyer plafonné par la loi. Dans ces deux
    derniers cas, la différence est remboursée sur demande.
  facts: [pt-imt-nonresident-flat, pt-imt-nonresident-exceptions]

- id: fr-hpp
  rank: 6
  stage: buying
  cta: tax
  q: "Habitação própria e permanente (HPP) : de quoi s'agit-il et y aurai-je droit ?"
  a: >-
    C'est le logement acheté exclusivement pour être votre résidence principale ; en matière d'impôt sur le
    revenu, la preuve est le domicile fiscal. Il donne droit au barème d'IMT le plus bas (0 % jusqu'à 106
    346 €) et à un crédit jusqu'à 90 % de la valeur, contre 80 % ailleurs. Non-résident fiscal, vous payez
    7,5 % ; résident dans les deux ans, la différence est remboursée.
  facts: [pt-imt-hpp-2026, pt-hpp-tax-domicile, pt-imt-nonresident-flat, pt-imt-nonresident-exceptions, pt-ltv-limits]

- id: fr-deed
  rank: 5.5
  stage: buying
  cta: lawyer
  q: "Combien coûtent l'acte et l'enregistrement ?"
  a: >-
    Au guichet Casa Pronta, l'acte et l'enregistrement se font en une seule fois : 375 €, ou 700 € avec
    un crédit hypothécaire, plus 50 € par bien supplémentaire. Apportez la licence d'utilisation (ou sa
    dispense, selon la date de construction) et le certificat énergétique. Les honoraires d'avocat
    s'ajoutent à part.
  facts: [pt-casa-pronta-fees, pt-casa-pronta-docs]

- id: fr-lawyer
  rank: 7
  stage: buying
  cta: lawyer
  q: "Ai-je besoin d'un avocat pour acheter ?"
  a: >-
    C'est votre choix, mais pour acheter à distance, un avocat évite des voyages et des risques. Il peut
    vérifier l'inscription du bien au registre et des documents comme la licence d'utilisation, relire le
    compromis avant signature et vous représenter à l'acte avec une procuration, pour signer depuis chez
    vous. Un avocat partenaire peut suivre l'achat du début à la fin.
  facts: [pt-poa-apostille, pt-sinal-442, pt-casa-pronta-docs]

- id: fr-yearly
  rank: 8
  stage: after
  cta: tax
  q: "Quels impôts dois-je payer chaque année ?"
  a: >-
    Vous payez l'IMI, un impôt municipal de 0,3 % à 0,45 % de la valeur fiscale du bien. Chaque commune
    fixe son taux, qui varie donc d'une commune à l'autre. L'AIMI, un impôt additionnel, ne s'applique
    que si la somme de vos valeurs fiscales dépasse 600 000 € par personne.
  facts: [pt-imi-rates, pt-aimi-deduction]

- id: fr-rent
  rank: 9
  stage: after
  cta: tax
  q: "Puis-je louer mon bien ?"
  a: >-
    Oui, en location longue durée ou touristique (alojamento local), qui exige un enregistrement
    préalable : la commune peut s'y opposer sous 60 jours, ou 90 en zone de limitation. Les loyers
    d'habitation des non-résidents sont imposés à 25 % au Portugal, avec des réductions pour les baux
    longs. Votre pays peut avoir ses propres règles.
  facts: [pt-al-registration, pt-rent-tax-nonresident]

- id: fr-sell
  rank: 10
  stage: after
  cta: tax
  q: "Combien d'impôt paie-t-on à la revente ?"
  a: >-
    Au Portugal, seule la moitié de la plus-value compte pour l'impôt sur le revenu : le gain sur la
    vente d'un bien est retenu à 50 %. Le taux final dépend de vos revenus. Votre pays de résidence peut
    aussi avoir des règles pour cette vente : les calculs se font donc des deux côtés.
  facts: [pt-cg-50pct]

- id: fr-borrow
  rank: 11
  stage: before
  cta: bank
  q: "Combien la banque peut-elle me prêter ?"
  a: >-
    Cela dépend surtout de vos revenus. Selon les règles de la Banque du Portugal, l'ensemble de vos
    mensualités ne doit pas dépasser 45 % de vos revenus nets. La durée peut aller jusqu'à 40 ans si
    vous avez 35 ans ou moins, et jusqu'à 35 ans au-delà.
  facts: [pt-dsti-45, pt-maturity-limits]

- id: fr-sign
  rank: 12
  stage: buying
  cta: lawyer
  q: "Dois-je être au Portugal pour signer ?"
  a: >-
    Vous pouvez signer depuis votre pays, avec une procuration, par exemple à un avocat, qui signe pour
    vous. Elle s'établit dans un consulat du Portugal ou devant un notaire de votre pays. Si elle est
    signée devant un notaire étranger, elle porte l'apostille de La Haye, un tampon qui la rend valable
    au Portugal.
  facts: [pt-poa-apostille]

- id: fr-cpcv
  rank: 13
  stage: buying
  cta: lawyer
  q: "Qu'est-ce que le compromis (CPCV) ?"
  a: >-
    C'est le contrat signé avant l'acte, qui fixe le prix, la date et les arrhes (sinal), la somme
    versée ce jour-là. Il protège les deux parties : si l'acheteur se désiste par sa faute, il perd les
    arrhes ; si c'est le vendeur, l'acheteur peut exiger le double de ce qu'il a versé (Code civil
    portugais, article 442).
  facts: [pt-sinal-442]

- id: fr-money
  rank: 14
  stage: buying
  cta: fx
  q: "Comment transférer l'argent au Portugal ?"
  a: >-
    Par votre banque ou par un service de transfert, et le change et les frais varient beaucoup de l'un
    à l'autre, ce qui compte sur de gros montants. Préparez les justificatifs de l'origine des fonds :
    banques, notaires et avocats doivent les demander quand l'opération le justifie (loi 83/2017).
  facts: [pt-aml-funds]

- id: fr-imt-calc
  rank: 15
  stage: buying
  cta: tax
  q: "Comment se calcule l'IMT et quand le payer ?"
  a: >-
    Pour les résidents, il dépend de l'usage du bien et du prix, par tranches : pas d'IMT jusqu'à 106
    346 € pour une résidence principale, 1 % dans cette tranche pour une résidence secondaire, puis le
    taux augmente. Les non-résidents fiscaux paient un taux unique de 7,5 %. L'IMT se paie le jour de sa
    liquidation ou dans les 30 jours.
  facts: [pt-imt-hpp-2026, pt-imt-second-home-2026, pt-imt-payment]

- id: fr-timing
  rank: 16
  stage: before
  cta: agency
  q: "Est-ce le bon moment pour acheter ?"
  a: >-
    Nous ne donnons pas de conseil en investissement, mais nous donnons les faits : selon l'INE, les
    prix des logements au Portugal ont augmenté de 17,6 % en 2025, la plus forte hausse de la série. Ce
    qui compte vraiment, c'est votre budget, la région et ce que vous attendez du bien. L'agence
    partenaire vous montre l'offre actuelle, sans engagement.
  facts: [pt-ine-prices-2025]

- id: fr-find
  rank: 17
  stage: before
  cta: agency
  q: "Pouvez-vous me trouver un bien ?"
  a: >-
    Oui : indiquez la région, le budget et votre calendrier, et votre demande part chez notre agence
    partenaire agréée, Habinedita Gondomar, qui vous contacte sans frais. Vous visitez en appel vidéo,
    par une personne de confiance ou sur place lors d'un séjour au Portugal. Vous pouvez aussi acheter à
    distance, par procuration.
  facts: []

- id: fr-inherit
  rank: 18
  stage: after
  cta: lawyer
  q: "J'ai hérité d'une maison au Portugal. Que faire ?"
  a: >-
    D'abord, les héritiers décident ensemble de garder, vendre ou louer la maison. Le conjoint ou
    partenaire, les enfants et les parents ne paient pas le droit de timbre de 10 % sur la succession au
    Portugal ; les autres héritiers le paient. Les enregistrements et autres formalités s'imposent à
    tous et peuvent se faire à distance.
  facts: [pt-is-inheritance-exempt]
