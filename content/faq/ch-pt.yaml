# Switzerland edition, Portuguese (pt-PT): questions added to common-pt.yaml. French version in ch-fr.yaml.

- id: chpt-01
  q: Posso usar o 2.º pilar para comprar casa em Portugal?
  a: >-
    Só para a residência principal. As regras federais permitem levantar antecipadamente o 2.º pilar para a
    casa onde vive, na Suíça ou no estrangeiro, mas não para uma casa de férias. O levantamento mínimo é de
    20 000 francos.
  cta: talk-tax
  facts: [ch-2nd-pillar-abroad]

- id: chpt-02
  q: E o 3.º pilar (3a)?
  a: >-
    O pilar 3a também pode ser levantado antecipadamente para adquirir habitação para uso próprio ou para
    amortizar um crédito à habitação. As condições concretas, como prazos e idade, dependem do contrato e das
    regras federais.
  cta: talk-tax
  facts: [ch-3a-home]
