# CH edition, European Portuguese: questions added to common-pt.yaml (same rules).

- id: pt-ch-2p
  rank: 3.5
  stage: before
  cta: tax
  q: "Posso usar o 2.º pilar para comprar casa em Portugal?"
  a: >-
    Sim, para a casa onde vai viver: as regras federais permitem levantar antecipadamente o 2.º pilar
    para a residência principal, na Suíça ou no estrangeiro, mas não para uma casa de férias ou para
    arrendar. O levantamento mínimo é de 20 000 francos. A sua caixa de pensões aplica as regras ao seu
    caso.
  facts: [ch-2nd-pillar-abroad]

- id: pt-ch-2p-rules
  rank: 3.6
  stage: before
  cta: tax
  q: "Que condições e efeitos tem o levantamento do 2.º pilar?"
  a: >-
    Reduz a sua pensão futura e tem de ser devolvido se vender a casa, salvo se comprar outra para viver
    em 2 anos. Só vale para um imóvel de cada vez, uma vez a cada 5 anos, pedido até 3 anos antes da
    reforma e com o acordo escrito do cônjuge. Depois dos 50 anos, o montante é limitado.
  facts: [ch-2p-conditions, ch-2p-effects]

- id: pt-ch-3a
  rank: 11.5
  stage: before
  cta: tax
  q: "E o 3.º pilar (3a)?"
  a: >-
    Sim, o pilar 3a também pode ser levantado antes do tempo para comprar uma habitação para uso próprio
    ou para amortizar um crédito à habitação. As condições concretas, como prazos e idade, dependem do
    seu contrato e das regras federais. A instituição do seu pilar 3a confirma-as para o seu caso.
  facts: [ch-3a-home]
