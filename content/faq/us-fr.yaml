# US edition, French (Luxembourg and Paris readers): questions added to common-fr.yaml (same rules).

- id: fr-us-visa
  rank: 6
  stage: before
  cta: lawyer
  q: "Acheter un bien permet-il de vivre au Portugal ?"
  a: >-
    Non. Depuis le 7 octobre 2023, l'achat d'un bien n'ouvre plus de nouvelles demandes de golden visa (loi
    56/2023). Acheter et s'installer au Portugal sont deux démarches distinctes : pour y vivre, il faut un
    visa de résidence, par exemple celui des personnes vivant de leurs propres revenus (D7). Un avocat
    partenaire peut vous orienter.
  facts: [pt-ari-realestate-ended, pt-visa-own-income]

- id: fr-us-report
  rank: 8.5
  stage: after
  cta: tax
  q: "Dois-je déclarer mon compte portugais aux États-Unis ?"
  a: >-
    Oui, si vos comptes à l'étranger dépassent 10 000 USD à un moment de l'année : les US persons déposent
    alors un FBAR auprès du FinCEN. En vivant hors des États-Unis, le formulaire 8938 peut aussi s'imposer
    au-delà de 200 000 USD d'avoirs étrangers en fin d'année ou de 300 000 USD à tout moment (déclaration
    individuelle).
  facts: [us-fbar, us-8938-abroad]

- id: fr-us-sale
  rank: 10.5
  stage: after
  cta: tax
  q: "La plus-value sur mon bien au Portugal est-elle imposée aux États-Unis ?"
  a: >-
    Elle peut l'être dans les deux pays, mais sans payer deux fois sur le même gain. Selon la convention
    entre le Portugal et les États-Unis, le Portugal peut imposer la plus-value des biens situés chez lui,
    et les États-Unis gardent le droit d'imposer leurs citoyens. Le crédit d'impôt étranger (formulaire
    1116) impute l'impôt portugais sur l'impôt américain.
  facts: [us-pt-treaty-gains]

- id: fr-us-ifici
  rank: 10.8
  stage: after
  cta: tax
  q: "Existe-t-il un régime fiscal spécial pour ceux qui s'installent au Portugal ?"
  a: >-
    Oui, pour certaines professions. L'IFICI applique un taux spécial de 20 % pendant 10 ans aux revenus du
    travail dans des activités éligibles, comme la recherche, l'enseignement supérieur ou les emplois
    hautement qualifiés. Il vise ceux qui deviennent résidents fiscaux sans l'avoir été pendant les cinq
    années précédentes. L'achat d'un bien n'y donne pas accès à lui seul.
  facts: [pt-ifici-20pct]
