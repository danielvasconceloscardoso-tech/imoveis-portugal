<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>O'rizon Living · Imóveis Portugal</title>
<link rel="canonical" href="/en/lu/map/?project=orizon">
<noscript><meta http-equiv="refresh" content="0; url=/en/lu/map/?project=orizon"></noscript>
<style>body{margin:0;background:#f6f3ec;color:#1e1e1c;font:400 16px/1.4 Helvetica,Arial,sans-serif}p{margin:40vh 16px 0;text-align:center}a{color:#2f5d50}</style>
<script>
// p70 (J-12, A-05, MI-10): the short link opens O'rizon Living's card on the map in the visitor's own edition and language.
// The site is static (no server code runs here), so the edition comes from, in order: the edition this browser last used
// on the site (localStorage "ip-ed" and "ip-lang", set by every page), the time zone as a stand-in for the country, the
// browser's languages, and otherwise today's default (/en/lu/). Nothing is stored or sent.
(function () {
  var MAP = { pt: "mapa", en: "map", fr: "carte" }, DEF = { lu: "pt", fr: "fr", ch: "fr", br: "pt", us: "en", il: "en" };
  var EDS = ["lu", "fr", "ch", "br", "us", "il"], ed = "", lang = "";
  try { ed = localStorage.getItem("ip-ed") || ""; lang = localStorage.getItem("ip-lang") || ""; } catch (e) {}
  var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""]).map(function (l) { return String(l).toLowerCase(); });
  var tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
  var BR = /^America\/(Sao_Paulo|Bahia|Fortaleza|Recife|Belem|Maceio|Araguaina|Manaus|Cuiaba|Campo_Grande|Porto_Velho|Boa_Vista|Rio_Branco|Eirunepe|Santarem|Noronha)$/;
  if (EDS.indexOf(ed) < 0) {
    ed = BR.test(tz) ? "br" : /^(America\/(New_York|Chicago|Denver|Phoenix|Los_Angeles|Anchorage|Detroit|Boise|Indiana|Kentucky|North_Dakota|Juneau|Sitka|Nome|Adak|Menominee|Metlakatla|Yakutat)|Pacific\/Honolulu)/.test(tz) ? "us"
      : /^Asia\/(Jerusalem|Tel_Aviv)$/.test(tz) ? "il" : tz === "Europe/Paris" ? "fr" : tz === "Europe/Luxembourg" ? "lu" : tz === "Europe/Zurich" ? "ch" : "";
  }
  if (!ed) for (var i = 0; i < langs.length && !ed; i++) {
    var l = langs[i];
    ed = l === "pt-br" ? "br" : /^fr-(ch)$/.test(l) || /^(de|it)-ch$/.test(l) ? "ch" : /^fr-lu$|^lb/.test(l) ? "lu" : /^fr/.test(l) ? "fr" : /^he|^iw|-il$/.test(l) ? "il" : l === "en-us" ? "us" : /^pt/.test(l) ? "lu" : "";
  }
  if (!ed) ed = "lu";
  if (!MAP[lang]) for (var j = 0; j < langs.length && !MAP[lang]; j++) { var b = langs[j].slice(0, 2); if (MAP[b]) lang = b; }
  if (!MAP[lang]) lang = DEF[ed] || "en";
  var q = new URLSearchParams(location.search); q.set("project", "orizon");
  location.replace("/" + lang + "/" + ed + "/" + MAP[lang] + "/?" + q.toString() + location.hash);
})();
</script>
</head>
<body><p><a href="/en/lu/map/?project=orizon">O'rizon Living</a></p></body>
</html>
